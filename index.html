<noscript>この読書アプリは章の表示にJavaScriptを使用します。JavaScriptを有効にしてご覧ください。</noscript><script>
const BOOK={"title":"わからない世界に、私はいる","intro":"これは、ある時期に交わした対話をもとに、思考の順序をできるかぎり尊重して編み直した日記である。実際の日常生活や出来事を創作してつなぐことはせず、疑問が生まれ、別の疑問へ移る過程を文章として再構成した。日付は主として対話の記録日であり、夢を見た正確な日と一致しない場合がある。科学的に確認されていること、未解決の問題、個人的な想像は、同じものとして扱わない。","chapters":[{"id":"01","date":"2025年11月17日（月）","title":"光を超えて離れていく","part":"宇宙の輪郭","body":"宇宙について読んでいると、光より速く遠ざかる銀河があるという説明に出会う。物体は光速を超えられないのに、なぜそんなことが起きるのだろう。\n\n答えは、物体が空間の中を光より速く走っているのではなく、空間の尺度そのものが変化しているからだという。宇宙の膨張によって、遠方の銀河との距離が増える。その増加率は、十分に離れた場所では光の速さに相当する値を超えられる。相対性理論と矛盾するわけではないらしい。\n\n説明を聞いて、ひとまず納得する。しかし、納得と同時に別の疑問が現れる。私たちが観測できる範囲には限りがある。では、その限界を理解するための理論が、どこまで宇宙そのものを表しているのだろう。\n\n観測できないものについては、どうしても仮定が必要になる。だから科学は間違っている、という話ではない。むしろ、限られた手掛かりから驚くほど多くのことを確かめてきた方法なのだと思う。ただ、いま有力な説明が、最後の説明だと決まったわけではない。\n\n私が気になるのは、観測結果の向こう側に残る「なぜ」という部分だ。宇宙が膨張するということを理解しても、空間が膨張できる理由まで自分が理解したとは思えない。答えを聞いたはずなのに、問いは消えない。","art":"orbit_b","tag":"日記"},{"id":"02","date":"2026年5月8日（金）","title":"膨張していると、なぜわかる","part":"宇宙の輪郭","body":"宇宙は膨張していると聞く。それが広く受け入れられていることは知っている。しかし、ふと、どうしてそうわかるのだろうと思った。\n\n宇宙を外側から撮影した人はいない。私たちは宇宙の中にいて、届いた光から遠方のことを調べている。それでも膨張を確かめられるのは、銀河の光の赤方偏移や、宇宙背景放射など、複数の観測が一つの筋の通った説明を支持しているからだという。\n\nなるほど、と感じる。ただ、その説明を頭の中に置いてみると、どこかで日常の感覚が邪魔をする。風船が膨らむ姿なら想像できる。だが、風船には表面があり、周囲には空気がある。宇宙が膨らむとき、同じように外へ広がる場所があるのだろうか。\n\n標準的な考え方では、そのような外側の場所は必要ないという。広がるのは空間の中にあるものだけではなく、距離を定める空間の尺度だ。\n\n私はそこが不思議だと思う。どういう数式で表されるかとは別に、「何もないように見えるところ」が広がるとは、どんなことなのか。自分の理解が追いつかないだけかもしれない。それでも、知らないままにしておくより、もう少し考えてみたくなった。","art":"horizon_b","tag":"日記"},{"id":"03","date":"2026年5月8日（金）","title":"何もない場所にも、何かがある","part":"宇宙の輪郭","body":"机と椅子の間に空間がある。地球と月の間にもある。二つの物の間には、何かが詰まっているのではないか。そんなことを考えた。\n\n空気のない場所を真空と呼ぶ。しかし、真空を「完全な無」と同じものと考えてよいのだろうか。物理学では、真空にも場の性質があり、重力の理論では時空そのものが幾何学的な性質を持つ。\n\nもちろん、ここでいう「何か」が、小さな粒子でぎっしり埋まっているという意味ではない。私が想像した物質のようなものと、科学が扱う場は区別しなければならない。\n\nそれにしても不思議だ。空間は、何かが置かれている舞台だと思っていた。ところが、その舞台そのものが変化し、物の運動にも関係するという。\n\nもし空間が物と物の関係から生まれるものだとしたら、物がひとつもないところに空間はあるのだろうか。逆に、空間が先にあるのなら、その空間は何に支えられているのだろう。\n\n少し難しく考えすぎている気もする。言葉の使い方を整理すれば、いくつかの疑問は解けるかもしれない。それでも、目の前の何もない場所を見ていると、「何もない」という表現は案外頼りないものに思えてくる。","art":"rings_b","tag":"日記"},{"id":"04","date":"2026年5月29日（金）","title":"意識が先にあったら","part":"意識と夢","body":"今度は、宇宙よりも意識のことが気になった。\n\nもし、意識が大きなひとつのもので、この世界がそこから生まれているのだとしたら。そんな考え方はできるだろうか。\n\n思いつきとしては、いろいろなことを説明できそうにも感じる。だが、思いついたからといって本当になるわけではない。何でも説明できる考え方は、裏返せば、何をもって確かめられるのかわからなくなる。\n\nそれでも、この発想をすぐに捨てる気にはならない。私たちが世界を知るとき、必ず意識を通しているからだ。目に入った光がそのまま風景になるのではなく、神経系の働きによって、私たちの経験になる。\n\nただし、ここには大きな違いがある。世界を意識によって経験していることと、世界そのものが意識から作られたことは同じではない。前者は日常の経験から考えられる。後者には、別の根拠が必要だろう。\n\n私はどちらかを信じたいわけではない。ひとつの疑問を眺めるために、いつもとは違う場所に立ってみたいだけだ。意識とは、そもそも何なのだろう。宇宙を考えていたのに、また別の大きな疑問に出会ってしまった。","art":"door_b","tag":"日記"},{"id":"05","date":"2026年5月31日（日）","title":"夢の情報はどこから来るのか","part":"意識と夢","body":"夢を見ているとき、夢の中の出来事はその場では現実のように感じられる。\n\n起きてから考えると不自然な場面が多い。場所が急に変わったり、人物の関係が入れ替わったりしている。夢の最中には、そんなことをおかしいと思わない場合もある。\n\n現実との違いは何だろう。私はまず、情報量が違うのではないかと考えた。起きているときには、温度や湿度、匂い、音、肌に触れる感覚など、いくつもの情報が同時に入ってくる。夢にはそこまでの細かさがないことが多い。\n\nでは、夢の情報量がもっと多くなれば、現実と区別できなくなるのだろうか。\n\nもちろん、夢と覚醒時の経験が違うのは、情報量だけではない。起きているときは外界と継続的にやり取りでき、別の人と同じ出来事を確かめることもできる。それでも、夢の中で現実らしさが生まれる仕組みは気になる。\n\n意識が世界をつくるという考えを、ここでも思い出す。ただし、夢を脳が構成するからといって、目の前の物理世界まで同じように脳が生み出しているという結論にはならない。\n\nここで知りたいのは、現実を疑う理由ではない。夢と現実のどちらも、私には「経験」として現れる、その不思議さのほうだ。","art":"rings_a","tag":"日記"},{"id":"06","date":"2026年9月20日ごろ","title":"川の底を測ろうとする","part":"意識と夢","body":"川についての夢を見た。水があふれるような状況を前に、どうすれば落ち着かせられるかを考えていた。\n\nただ流れを眺めていたのではない。深さを測り、底にたまった泥を確かめ、必要なら掘り下げることまで考えていた。実際に浚渫をしたわけではないが、夢の中では、ひとつずつ条件を整理しようとしていたらしい。\n\n妙なのは、夢の中でも考える仕事をしていたことだ。数字や状況を確かめ、原因を探し、対応を想像している。起きているときの考え方が、眠っている間も続いているようだった。\n\nもっとも、夢の景色を後から正確に再現できるわけではない。覚えているのは、考えていた手順の断片だ。そこから意味のある物語を作りすぎると、かえって本当に見たものから離れてしまう。\n\n夢には何かの暗示がある、などと考える必要はないと思う。それでも、眠っている脳が、何を材料に、なぜそういう場面を組み立てるのかは面白い。\n\n昼間なら普通にするような問題解決が、夜には水の流れを相手に始まっている。目覚めたあと、その奇妙さだけが残った。","art":"horizon_a","tag":"日記"},{"id":"07","date":"2026年10月10日（土）","title":"白木の刀と、地鎮祭","part":"意識と夢","body":"いくつかの夢を覚えていた。\n\n一つは、戦争の時代を思わせる場面だった。白木に包まれた刀があり、そのあとには、同じように白木に包まれた長い銃が現れた。持ってみると、妙に軽かった。\n\n別の夜には、地鎮祭の準備をする夢を見た。その前には、人とにぎやかにしていたような記憶もある。どの場面がどのようにつながっていたのか、もうはっきりしない。\n\n不思議なものだ。見たことのある物、仕事に関係する風景、どこかから借りてきたような時代の雰囲気。それらが、説明もなくひとつの夢になる。\n\nあの刀や銃には何か意味があるのだろうか、と考えたくなる。でも、特定の象徴に結びつける根拠はない。むしろ興味深いのは、夢のなかでは「軽さ」まで感じられたことだ。\n\n記憶にある物の感触を、脳はどこまで再現できるのだろう。現実に物を持ったときの感覚と、夢の中で持ったつもりになる感覚は、どこが違うのだろう。\n\n意味を読み取るより、まず、こんなことが起きるという事実を面白がっていたい。","art":"door_a","tag":"日記"},{"id":"08","date":"2026年11月7日（土）","title":"光は速いのに、遅い","part":"時間の向こう","body":"光の速さについて考えた。光だけが速いというより、電磁波は真空中では同じ速さで伝わる。可視光だけが特別というわけではない。\n\nその速さは約30万キロメートル毎秒。地球の上で暮らす人間にとっては、ほとんど瞬間のような速さだ。\n\nでも、宇宙の大きさを考えると印象が変わる。10万光年先の天体から届く光は、10万年かけてこちらへ来る。私たちが見ているのは、その天体の10万年前の姿だ。\n\nその天体にも、私たちにとっての「今」に相当する出来事があるはずだ。しかし、いま手元にある情報から、それを直接知ることはできない。\n\n当たり前のことなのに、妙な仕組みに思える。宇宙がこれほど広いのなら、光はずいぶん遅いのではないか。\n\nもちろん、光速の値が遅いというのは人間の感想でしかない。自然には、人間が便利だと思う速さを選ぶ理由はない。それでも、世界がこういう速度の限界を持っていることには、何か根本的な意味があるのだろうと思う。\n\nわかったつもりだったことを、別の尺度で眺めただけで、こんなにも不思議に感じる。","art":"orbit_a","tag":"日記"},{"id":"09","date":"2026年11月7日（土）","title":"ゲームの外を見ること","part":"時間の向こう","body":"遠い星の現在を直接見ることができない。そのことを考えていて、ゲームの世界を思い浮かべた。\n\nゲームの登場人物は、ゲームの中を歩くことができる。しかし、ゲームが動いている装置や、画面のこちら側は見えない。もし自分がその登場人物なら、自分のいる世界がすべてだと思うのではないか。\n\n宇宙にも、少し似たところがあるように感じる。私たちは世界の内部にいて、その内部で観測できるものから全体を推測している。外側に出て見渡すという方法は使えない。\n\nだからといって、宇宙がゲームだとか、誰かが作ったとか言いたいわけではない。そういう結論へ飛びつけば、それは別の物語になってしまう。私が面白いと思ったのは、知ることにも構造上の限界があるかもしれないという点だ。\n\nそもそも宇宙に「外側」があるのかもわからない。ないのであれば、見られないのではなく、外側という問い自体が適切ではないことになる。\n\n私たちが使う言葉は、日常の世界で覚えたものだ。中と外、前と後、始まりと終わり。それを宇宙全体に当てはめるとき、どこかで無理をしているのかもしれない。\n\nそんなことを考えていると、世界を理解するには、まず自分の考え方の癖を知る必要があるような気がしてくる。","art":"door_b","tag":"日記"},{"id":"10","date":"2026年11月7日（土）","title":"過去はどこにあるのか","part":"時間の向こう","body":"10万年前の光を見ているなら、目に映る宇宙は、いろいろな時代の情報の寄せ集めということになる。\n\nそこから、過去について考え始めた。私が覚えている昨日は、昨日そのものではない。いまの脳に残った記憶だ。\n\n記憶は変わる。何度も思い出すうちに、細部が入れ替わることもある。だから記憶を確かめるには、写真や記録、他の人の証言が役に立つ。\n\nでは、私が過去を思い出すとき、本当に触れているのは何だろう。過去に戻っているわけではなく、現在に残った手掛かりを使っているだけだ。\n\nそれは過去が存在しなかったという意味ではない。過去の出来事が現在に痕跡を残すからこそ、私たちは歴史を調べることができる。ただ、自分の経験としての過去は、思いのほか不確かなものだ。\n\n結局、本当にあるのは今だけなのだろうか。\n\nここでの「今」は、宇宙全体に共通する絶対的な瞬間ではない。相対性理論は、離れた出来事の同時性が単純ではないことを教えている。それでも、自分が何かを経験する場所は、いつもこの瞬間だ。\n\n過去を考えていたら、現在まで怪しくなってきた。わからなくなることを、少し楽しんでいる自分がいる。","art":"rings_b","tag":"日記"},{"id":"11","date":"2026年11月7日（土）","title":"ただ、あるだけ","part":"時間の向こう","body":"宇宙のことから始まった考えは、いつの間にか自分に戻ってきた。\n\nなぜ人間は考えるのだろう。危険を避け、食べ物を探し、先のことを予測する。考える能力には、生き延びるうえでの役割があるだろう。わからないことを減らそうとするのは、生き物として自然な働きなのかもしれない。\n\nそれでも、目の前の生活に直接役立たない問いまで、どうして考えたくなるのだろう。\n\n自分という存在が自然現象のひとつだとしたら、考えることも、その現象の一部なのだろう。脳が働き、何かを感じ、理由を探す。特別な目的がなくても、それは起きている。\n\n身体はいつか衰えて、働きを止める。そのとき、何かがわかるのだろうか。わからない。今の私には確かめようがない。\n\nただ、ひとつ願いがある。自分がいなくなっても、この世界が、何億年先まで続いていてほしい。\n\n私が知ることができなくても、星が生まれ、知らない生き物が現れ、何かが変わり続けていたらいいと思う。\n\n存在する理由はわからない。でも、いま自分がいることは確かだ。その確かさだけを手にして、今日も考えている。\n\n何か壮大な意味があるのではなく、ただ、あるだけなのかもしれない。","art":"horizon_b","tag":"日記"},{"id":"12","date":"2026年11月8日ごろ","title":"眠っている間の映画","part":"眠りの観察","body":"夢について、もう少し考えた。\n\n起きている間、脳には感覚器からさまざまな情報が入ってくる。それを受け取り、整理し、次に何が起こるかを予測しながら生活している。\n\nでは眠っている間、脳は何をしているのだろう。入力が少ないぶん、蓄えた材料を組み合わせ、映像のようなものを作っているのだろうか。\n\nふと思いついたのは、目覚めているときが入力で、夢を見ているときが出力、という大まかな捉え方だった。もちろん実際の脳は、そんな単純な二つのモードに分かれてはいない。睡眠中にも多様な神経活動があり、夢を見た記憶が残るかどうかも別の問題だ。\n\n深く眠っているときには夢を見ていないのだろうか。それとも、見ていても覚えていないだけなのだろうか。\n\n起きた瞬間には確かにあった風景が、数分のうちに消えていくことがある。夢を見なかったと思う日も、本当は忘れているだけかもしれない。\n\n夢が何かを予言するとは思わない。それでも、眠っている脳が何を作っているかを考えるのは、案外、宇宙のことを考えるのと似ている。どちらも、直接つかまえようとすると、すぐに遠ざかってしまう。","art":"rings_a","tag":"日記"},{"id":"13","date":"2026年11月8日ごろ","title":"沖縄まで行ったはずだった","part":"眠りの観察","body":"沖縄へ出張する夢を見た。\n\n電車に乗り、歩き、タクシーを使いながら移動していた。夢の中では、その場所に確かにいたという感覚があった。\n\n目が覚めると、少しずつ様子が変わる。さっきまで経験していたはずの道順が、思い出そうとするほど曖昧になっていく。細かい場所の配置も、人の動きも、消えてしまう。\n\n夢には、ひどく壊れた会社の携帯電話まで出てきた。形はぐちゃぐちゃになっているのに、なぜか通話できたらしい。\n\n起きていれば、そんな電話が使えるのはおかしいと思う。でも夢の中では、壊れていることと使えることが、矛盾しないまま並んでいた。\n\n夢の場面をあとから振り返ると、現実との違いはそこにもあるのだと思った。私たちは起きているとき、外の世界から絶えず修正を受ける。電話が本当に使えなければ、その場でわかる。夢の中には、その修正が十分には働かない場合がある。\n\nだからといって、夢を見ている間の「いた」という感覚が嘘だったとも言い切れない。外の沖縄にいたわけではないが、沖縄にいるという経験は、確かにあった。\n\n場所にいるとは、どういうことなのだろう。夢はそんな問いまで持ってくる。","art":"door_a","tag":"日記"},{"id":"14","date":"2026年11月8日ごろ","title":"生成される映像","part":"眠りの観察","body":"夢を思い出していると、生成AIが作る画像を連想した。\n\nいろいろな特徴を組み合わせれば、実際には存在しない風景でも、もっともらしく見える。夢も、記憶の断片から場面を作っているように感じられる。\n\nけれども、生成AIと脳が同じ仕組みで動いているとは言えない。どちらも情報を使って新しい表現を生み出す点では似て見えるが、その内部の働きも、経験の有無も、簡単には比べられない。\n\n私が気になったのは別のことだ。起きているときの脳も、現実をそのまま写しているわけではないのではないか。\n\n見間違いや勘違いがある。記憶はあやふやだ。見えない部分を、経験から補っていることもある。それでも、私たちはまとまりのある世界を見ている。\n\n夢も現実も、経験としては脳の働きと切り離せない。ただし、現実の知覚には、外界から検証できる入力があり、夢と同じように扱うことはできない。\n\nそう区別しても、不思議さは残る。脳が世界をどう表現しているのか。私は何を見ているのか。\n\n世界が偽物だという結論を出したいわけではない。いつも当たり前だと思っている『見える』ということが、少し不思議になっただけだ。","art":"orbit_b","tag":"日記"},{"id":"15","date":"2026年11月14日（土）","title":"味のする透明なゼリー","part":"眠りの観察","body":"車のドアが外されて、どこかに置かれている夢を見た。場面は不自然で、うまく筋道を説明できない。\n\nその夢の中で、フランスの透明なゼリーを食べた。奇妙なのは、味がしたことだ。口の中の感覚まで、かなりはっきり覚えていた。\n\n以前、夢と現実の違いは情報量ではないかと考えた。だが、夢の中でも味を感じたことになる。もちろん、本当に食べ物が舌に触れた証拠はない。味を感じる経験が、眠っている間に起きたということだ。\n\nそのとき、喉には痛みがあった。身体の感覚が夢に入り込むことはあるのだろうか。あるいは、昼間に経験したことや覚えている味が、夢の材料になったのだろうか。\n\nどれが原因か、私にはわからない。ただ、夢は視覚だけではないということを、実感として考えるきっかけになった。\n\n目覚めてから冷静に振り返れば、車のドアもゼリーも、一つの物語としてつながっていない。だが夢の最中には、味まで含めて、ひとまとまりの経験になっていた。\n\n夢に意味があると決めるより、あの味はどのように生まれたのか、と考えるほうが面白い。","art":"rings_b","tag":"日記"},{"id":"16","date":"2026年11月14日（土）","title":"同じ色を見ているのだろうか","part":"眠りの観察","body":"ものを見るということを、改めて考えた。\n\n目の前に景色がある。光が目に入り、脳が情報を処理する。私は景色を見ていると思っている。しかし、その景色がそのまま頭の中に置かれているわけではない。\n\n見えない部分を補ったり、注意していないものを見落としたりする。脳は必要な情報を選び、ひとつの経験にまとめている。\n\nでは、同じものを見た二人は、同じように経験しているのだろうか。\n\n例えば赤いものを指して、二人とも『赤い』と言う。言葉は一致する。でも、二人の内側に生じている色の感じまで同じなのかは、簡単には確かめられない。\n\nもちろん、色覚には共通する生理学的な仕組みがあり、違いを測る方法もある。それでも、主観的な感じそのものを相手の視点から直接経験することはできない。\n\n相手も私と同じように世界を見ている、と普段は思っている。それでほとんど不自由はない。ただ、そこには確かめきれない部分がある。\n\nだからといって、他人とわかり合えないと嘆く必要はない。すべてを共有できないかもしれないからこそ、言葉にして確かめ合うのだろう。違う景色を見ている可能性も含めて、人と話すことは案外不思議なことだ。","art":"orbit_a","tag":"日記"},{"id":"17","date":"2026年11月14日（土）","title":"まどろみの中で返事をする","part":"眠りの観察","body":"眠りに落ちかけたとき、少し変わった経験をした。\n\n現実にある物の配置を思い浮かべていた。映像ははっきりしないが、だいたいの並びは合っている。ただ、一部は実際と違っているようだった。\n\nその中で、誰かが何かを尋ね、私はその映像をもとに考えて答えていた。完全に起きているわけでも、はっきり夢を見ているわけでもない。半分だけ眠っているような状態だった。\n\n自分で考え始めたはずなのに、途中から別の意識が勝手に動き出したようにも感じられた。もちろん、本当に別の意識がいたという意味ではない。自分の思考を、自分のものとして扱う感覚が少し揺らいだのだろう。\n\n目覚めてしばらくすると、細部は薄れてしまった。あの問いに何と答えたのかも、正確には思い出せない。\n\nこういう体験をすると、普段の『自分で考えている』という感覚も、ひとつの働きによって成り立っているのかもしれないと思う。\n\n思考はいつ、私の思考になるのだろう。夢の中でも答えを考え、目覚めればその考えが遠ざかる。\n\nそれでも、いま書いているこの考えも、間違いなく自分の中にある。わからないことが、またひとつ増えた。","art":"door_b","tag":"日記"},{"id":"18","date":"2026年11月14日（土）","title":"何を探しているのだろう","part":"これから","body":"振り返ると、ずいぶんあちこち考えてきた。\n\n宇宙がなぜ膨張するのか。空間は何なのか。光はどうして届くまでに時間がかかるのか。過去はどこにあるのか。夢の中の景色を見ているのは誰なのか。\n\nそれぞれ別の話のようで、どこかでつながっている気がする。世界を知りたいという問いを続けているうちに、世界を知ろうとしている自分が気になってきたのだ。\n\n答えが見つからないからといって、特別な説明を作ろうとは思わない。わからないところは、わからないまま残しておきたい。観測や実験によって明らかにされたことは尊重したいし、思いつきは思いつきとして扱いたい。\n\n人間はなぜ考えるのだろう。私はまだわからない。たぶん、しばらくは同じ問いを考えているだろう。\n\nただ、考えることには奇妙な楽しさがある。今日の疑問が、別の日には違う形になって戻ってくる。前に納得したことを、あらためて不思議に感じることもある。\n\n私がいなくなったあとも世界は続くだろうか。続いていてほしいと思う。その願いは、答えを求めることとは少し違う。\n\nどうしてここにいるのかわからない。でも、私はここにいる。そういう、どうしようもなく普通の事実から、また考え始めようと思う。","art":"horizon_a","tag":"結び"}]};

const home=document.getElementById('home'), reader=document.getElementById('reader');
const dialog=document.getElementById('tocDialog'), progress=document.getElementById('progress');
const toc=document.getElementById('tocList'), dialogItems=document.getElementById('dialogItems');
const $=id=>document.getElementById(id);
let current=-1, font=20;
$('intro').textContent=BOOK.intro;
function paras(parent,txt){parent.replaceChildren();txt.split(/\n\s*\n/).forEach(t=>{const p=document.createElement('p');p.textContent=t;parent.appendChild(p)});}
function entryButton(c,i){
 const btn=document.createElement('button');btn.className='toc-item';btn.type='button';
 const no=document.createElement('span');no.className='toc-no';no.textContent=String(i+1).padStart(2,'0');
 const mid=document.createElement('span'),name=document.createElement('span'),date=document.createElement('span');
 name.className='toc-item-title';name.textContent=c.title;date.className='toc-date';date.textContent=c.date;
 mid.append(name,date);const ar=document.createElement('span');ar.className='toc-arr';ar.textContent='→';
 btn.append(no,mid,ar);btn.addEventListener('click',()=>{if(dialog.open)dialog.close();location.hash='entry-'+c.id});return btn;
}
chapters.forEach((c,i)=>{toc.appendChild(entryButton(c,i));dialogItems.appendChild(entryButton(c,i));});
function changeFont(delta){font=Math.max(18,Math.min(26,font+delta));document.documentElement.style.setProperty('--reading-size',font+'px');$('fontValue').textContent=font+' px';}
$('fontIncrease').addEventListener('click',()=>changeFont(1));$('fontDecrease').addEventListener('click',()=>changeFont(-1));
$('openToc').addEventListener('click',()=>dialog.showModal());$('mobileToc').addEventListener('click',()=>dialog.showModal());$('closeToc').addEventListener('click',()=>dialog.close());
$('startReading').addEventListener('click',()=>location.hash='entry-01');
$('titleHome').addEventListener('click',()=>{location.hash='home'});
$('printAction').addEventListener('click',()=>window.print());
$('copyLink').addEventListener('click',async()=>{
 const b=$('copyLink');try{
  if(navigator.clipboard&&location.protocol!=='file:'){await navigator.clipboard.writeText(location.href);b.textContent='コピー済み';}
  else {b.textContent='この端末では利用不可';}
 }catch(e){b.textContent='コピーできません';}
 b.setAttribute('aria-live','polite');
});
function goto(index){if(index<0||index>=chapters.length)return;location.hash='entry-'+chapters[index].id;}
$('prevBottom').addEventListener('click',()=>goto(current-1));$('nextBottom').addEventListener('click',()=>goto(current+1));
$('prevMobile').addEventListener('click',()=>goto(current-1));$('nextMobile').addEventListener('click',()=>goto(current+1));
function buildRail(){const rail=$('railLinks');rail.replaceChildren();chapters.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.className='rail-link'+(i===current?' current':'');b.textContent=String(i+1).padStart(2,'0')+'  '+c.title;b.addEventListener('click',()=>goto(i));rail.appendChild(b)});}
function render(){
 const match=location.hash.match(/^#entry-(\d{2})$/),idx=match?chapters.findIndex(c=>c.id===match[1]):-1;
 current=idx;const isHome=idx===-1;
 home.style.display=isHome?'block':'none';reader.style.display=isHome?'none':'block';$('mobilebar').style.display=isHome?'none':'';
 document.title=isHome?'わからない世界に、私はいる':chapters[idx].title+' | わからない世界に、私はいる';
 if(!isHome){const c=chapters[idx];$('chapterNum').textContent=String(idx+1).padStart(2,'0')+' / '+chapters.length;$('chapterTitle').textContent=c.title;$('chapterDate').textContent=c.date;
  paras($('chapterBody'),c.body);const fig=$('chapterFigure');fig.replaceChildren();if(c.art){const img=document.createElement('img');img.src=ART[c.art];img.alt='白黒の抽象的な版画調挿絵';img.loading='eager';fig.appendChild(img);const cap=document.createElement('figcaption');cap.textContent='図版 '+String(idx+1).padStart(2,'0')+'　―　思考の断片';fig.appendChild(cap)}
  $('prevBottom').disabled=$('prevMobile').disabled=idx===0;
  $('nextBottom').disabled=$('nextMobile').disabled=idx===chapters.length-1;
  $('prevBottom').querySelector('strong').textContent=idx>0?chapters[idx-1].title:'—';
  $('nextBottom').querySelector('strong').textContent=idx<chapters.length-1?chapters[idx+1].title:'—';
  buildRail();
 }
 window.scrollTo({top:0,behavior:'instant'});updateProgress();
}
function updateProgress(){if(current<0){progress.style.width='0%';return;}const max=document.documentElement.scrollHeight-innerHeight;const pc=max>0?Math.min(100,Math.max(0,scrollY/max*100)):100;progress.style.width=pc+'%';}
window.addEventListener('hashchange',render);window.addEventListener('scroll',updateProgress,{passive:true});window.addEventListener('resize',updateProgress);
document.addEventListener('keydown',e=>{if(dialog.open||['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(current>=0&&e.key==='ArrowRight'){goto(current+1)}if(current>=0&&e.key==='ArrowLeft'){goto(current-1)}});
const print=$('printBook');const cover=document.createElement('section');cover.className='print-cover';const title=document.createElement('h1');title.textContent=BOOK.title;const sub=document.createElement('span');sub.className='sub';sub.textContent='ある人間の思考日記';cover.append(title,sub);print.appendChild(cover);
const intro=document.createElement('div');intro.className='print-intro';intro.textContent=BOOK.intro;print.appendChild(intro);
chapters.forEach(c=>{let art=document.createElement('section');art.className='print-entry';const date=document.createElement('div');date.className='print-date';date.textContent=c.date;const h=document.createElement('h2');h.textContent=c.title;art.append(date,h);if(c.art){const img=document.createElement('img');img.src=ART[c.art];img.className='print-img';img.alt='抽象挿絵';art.append(img)}const b=document.createElement('div');paras(b,c.body);art.append(b);print.appendChild(art)});
render();
